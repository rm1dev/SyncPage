# =============================================================================
# SyncPage Master — production stack (app مستقیم روی HTTP_PORT)
# Usage: docker compose -f docker-compose.master.yml --env-file .env up -d --build
# Panel: ${PUBLIC_BASE_URL}/spadmin  (پیش‌فرض host port 1313)
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncpage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpage}
      POSTGRES_DB: ${POSTGRES_DB:-syncpage}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncpage} -d ${POSTGRES_DB:-syncpage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-syncpage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-syncpage}
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    volumes:
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/docker-entrypoint.sh:/entrypoint-wrapper.sh:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmqdata:/var/lib/rabbitmq
    ports:
      # Edgeها باید به AMQP برسن — بعضی مسیرهای بین‌الملل 5672 را خراب می‌کنند
      - "5672:5672"
      # پورت جایگزین عمومی (همان بروکر) — در RABBITMQ_PUBLIC_URL بگذار مثلاً :45672
      - "${RABBITMQ_PUBLIC_PORT:-45672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      NODE_ROLE: MASTER
      PORT: ${APP_PORT:-3000}
      # همون RABBITMQ_PASS که به بروکر هم داده می‌شه
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-syncpage}:${RABBITMQ_PASS:-syncpage}@rabbitmq:5672
      DATABASE_URL: postgresql://${POSTGRES_USER:-syncpage}:${POSTGRES_PASSWORD:-syncpage}@db:5432/${POSTGRES_DB:-syncpage}?schema=public
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
    ports:
      # داشبورد / API مستقیم از app — پیش‌فرض 1313 روی هاست
      - "${HTTP_PORT:-1313}:${APP_PORT:-3000}"
    # برای Verify نود هم‌محل روی host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # PORT داخل کانتینر همون APP_PORT هست
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-3000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  rmqdata:
  static_pages:
  temp_data:
