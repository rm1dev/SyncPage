# =============================================================================
# SyncPage Master — production stack
# Usage: docker compose -f docker-compose.master.yml --env-file .env up -d --build
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncpage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpage}
      POSTGRES_DB: ${POSTGRES_DB:-syncpage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncpage} -d ${POSTGRES_DB:-syncpage}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-syncpage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-syncpage}
    volumes:
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmqdata:/var/lib/rabbitmq
    ports:
      # Edgeها باید به 5672 برسن
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      NODE_ROLE: MASTER
      PORT: ${APP_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-syncpage}:${POSTGRES_PASSWORD:-syncpage}@db:5432/${POSTGRES_DB:-syncpage}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-syncpage}:${RABBITMQ_PASS:-syncpage}@rabbitmq:5672
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
    ports:
      - "${HTTP_PORT:-80}:${APP_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-3000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  rmqdata:
  static_pages:
  temp_data:
