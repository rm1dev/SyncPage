# =============================================================================
# SyncPage Edge — نود ریموت (جدا از Master)
# شبکهٔ host تا egress به RabbitMQ Master از Docker bridge timeout نخوره
#
# Usage:
#   docker compose -f docker-compose.node.remote.yml --env-file .env up -d --build
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncpage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncpage}
      POSTGRES_DB: ${POSTGRES_DB:-syncpage_edge}
    volumes:
      - pgdata_edge:/var/lib/postgresql/data
    # فقط از localhost هاست در دسترس باشه (اپ با host network بهش وصل می‌شه)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-syncpage} -d ${POSTGRES_DB:-syncpage_edge}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    # کل stack شبکهٔ هاست — مسیر AMQP مثل nc از خود VPS عمل می‌کنه
    network_mode: host
    env_file: .env
    environment:
      NODE_ROLE: EDGE
      PORT: ${APP_PORT:-3000}
      EDGE_NODE_ID: ${EDGE_NODE_ID:-}
      # مهم: با host network اسم سرویس db دیگه resolve نمی‌شه
      DATABASE_URL: postgresql://${POSTGRES_USER:-syncpage}:${POSTGRES_PASSWORD:-syncpage}@127.0.0.1:${POSTGRES_HOST_PORT:-5433}/${POSTGRES_DB:-syncpage_edge}?schema=public
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${APP_PORT:-3000}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata_edge:
  static_pages:
  temp_data:
