worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  upstream app_master {
    server app-master:3000;
  }

  upstream app_edge {
    server app-edge:3000;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # مسیر قدیمی
    location = /admin {
      return 301 /spadmin;
    }
    location /admin/ {
      return 301 /spadmin/;
    }

    # پنل ادمین و API مدیریتی به Master
    location /spadmin {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ثبت فرم روی Edge — سریع و مستقل از Master
    location ~ ^/api/forms/[^/]+/submit/?$ {
      proxy_pass http://app_edge;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /preview/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /public/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # مسیر قدیمی /pages/:slug → /:slug
    location /pages/ {
      rewrite ^/pages/(.*)$ /$1 permanent;
    }

    # فقط روت دامنه → پنل
    location = / {
      return 302 /spadmin;
    }

    # لندینگ‌ها روی روت دامنه: /:slug/ — اگه نبود 404، نه ریدایرکت به داشبورد
    location / {
      root /static_pages;
      index index.html;
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}
