worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Master پروداکشن — پنل روی /spadmin، لندینگ‌ها روی /:slug/
  upstream app_master {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # مسیر قدیمی
    location = /admin {
      return 301 /spadmin;
    }
    location /admin/ {
      return 301 /spadmin/;
    }

    location /spadmin {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /preview/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
      proxy_pass http://app_master;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # مسیر قدیمی /pages/:slug → /:slug
    location /pages/ {
      rewrite ^/pages/(.*)$ /$1 permanent;
    }

    # فقط روت دامنه → پنل (لندینگ‌ها هرگز به داشبورد نرن)
    location = / {
      return 302 /spadmin;
    }

    # لندینگ‌ها: /:slug/ از volume استاتیک — نبود → 404 (نه ریدایرکت به پنل)
    location / {
      root /static_pages;
      index index.html;
      try_files $uri $uri/ $uri/index.html =404;
    }
  }
}
