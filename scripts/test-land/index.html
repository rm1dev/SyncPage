<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تست لندینگ</title>
  <style>
    /* فونت‌های لوکال Vazirmatn — داخل خود پکیج لندینگ */
    @font-face {
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('fonts/Vazirmatn-Light.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/Vazirmatn-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: url('fonts/Vazirmatn-Medium.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('fonts/Vazirmatn-SemiBold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/Vazirmatn-Bold.woff2') format('woff2');
    }

    :root {
      --ink: #12251f;
      --ink-soft: #3a534a;
      --paper: #f3f7f4;
      --surface: rgba(255, 255, 255, 0.72);
      --line: rgba(18, 37, 31, 0.12);
      --accent: #1f7a5c;
      --accent-deep: #145c44;
      --glow: rgba(45, 140, 110, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 55% at 100% 0%, var(--glow), transparent 55%),
        radial-gradient(ellipse 70% 50% at 0% 100%, rgba(20, 70, 55, 0.14), transparent 50%),
        linear-gradient(165deg, #e8f1ec 0%, var(--paper) 45%, #dfeae4 100%);
      line-height: 1.7;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.25rem;
    }

    .shell {
      width: min(440px, 100%);
      animation: rise 0.7s ease both;
    }

    .brand {
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 0.35rem;
      animation: rise 0.7s ease 0.08s both;
    }

    .lead {
      margin: 0 0 1.75rem;
      color: var(--ink-soft);
      font-size: 1.02rem;
      font-weight: 400;
      animation: rise 0.7s ease 0.16s both;
    }

    #sp-form-test {
      display: grid;
      gap: 1rem;
      padding: 1.35rem 1.25rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(18, 37, 31, 0.08);
      animation: rise 0.7s ease 0.24s both;
    }

    #sp-form-test label {
      display: grid;
      gap: 0.4rem;
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--ink-soft);
    }

    #sp-form-test input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 0.65rem;
      padding: 0.75rem 0.9rem;
      font: inherit;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.9);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #sp-form-test input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(31, 122, 92, 0.18);
    }

    #sp-form-test button[type='submit'] {
      margin-top: 0.35rem;
      border: 0;
      border-radius: 0.7rem;
      padding: 0.85rem 1rem;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(180deg, var(--accent), var(--accent-deep));
      cursor: pointer;
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    #sp-form-test button[type='submit']:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    #sp-form-test button[type='submit']:active {
      transform: translateY(0);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shell,
      .brand,
      .lead,
      #sp-form-test {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <h1 class="brand">تست لندینگ</h1>
      <p class="lead">نام و ایمیلت رو بفرست تا ثبت بشه.</p>

      <form id="sp-form-test">
        <label>
          نام کامل
          <input type="text" name="fullName" required />
        </label>
        <label>
          ایمیل
          <input type="email" name="email" required />
        </label>
        <button type="submit">Submit</button>
      </form>
    </div>
  </main>

  <script>
  (function () {
    var form = document.getElementById("sp-form-test");
    if (!form) return;

    try {
      var searchParams = new URLSearchParams(window.location.search);
      searchParams.forEach(function (val, key) {
        if (key.indexOf('utm_') === 0 && val) {
          sessionStorage.setItem('sp_' + key, val);
        }
      });
    } catch (e) {}

    function getStoredUtms() {
      var utms = {};
      try {
        for (var i = 0; i < sessionStorage.length; i++) {
          var k = sessionStorage.key(i);
          if (k && k.indexOf('sp_utm_') === 0) {
            utms[k.replace('sp_', '')] = sessionStorage.getItem(k);
          }
        }
      } catch (e) {}
      return utms;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var data = Object.fromEntries(new FormData(form).entries());
      var utms = getStoredUtms();
      Object.assign(data, utms);

      var qs = window.location.search;
      var res = await fetch("/api/forms/test/submit" + qs, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        var err = await res.json().catch(function () { return {}; });
        alert(err.message || 'Submit failed');
        return;
      }
      alert('Submitted successfully');
      form.reset();
    });
  })();
  </script>
</body>
</html>
