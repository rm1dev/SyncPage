# =============================================================================
# فقط برای توسعهٔ محلی (Master + Edge)
# روی سرور پروداکشن Master از این فایل استفاده نکنید:
#   docker compose -f docker-compose.master.yml --env-file .env up -d
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncpage
      POSTGRES_PASSWORD: syncpage
      POSTGRES_DB: syncpage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncpage -d syncpage"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: syncpage
      RABBITMQ_DEFAULT_PASS: syncpage
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    volumes:
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/docker-entrypoint.sh:/entrypoint-wrapper.sh:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app-master:
    build: .
    environment:
      NODE_ROLE: MASTER
      NODE_ENV: development
      PORT: "2001"
      DATABASE_URL: postgresql://syncpage:syncpage@db:5432/syncpage?schema=public
      RABBITMQ_URL: amqp://syncpage:syncpage@rabbitmq:5672
      RABBITMQ_PUBLIC_URL: amqp://syncpage:syncpage@localhost:5672
      RABBITMQ_QUEUE: landing.sync
      RABBITMQ_MASTER_QUEUE: form.submission
      ADMIN_TOKEN: change-me-admin-token
      STATIC_PAGES_PATH: /app/static_pages
      TEMP_PATH: /app/temp
      MASTER_INTERNAL_URL: http://app-master:2001
      PUBLIC_BASE_URL: http://localhost:2001
      OUTBOX_POLL_MS: "3000"
      OUTBOX_MAX_ATTEMPTS: "10"
      SYNCPAGE_GITHUB_REPO: rm1dev/SyncPage
      SYNCPAGE_GITHUB_BRANCH: main
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
      # محیط توسعه: mount کردن کدها برای hot-reload
      - ./src:/app/src
      - ./views:/app/views
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      # ایزوله کردن node_modules کانتینر
      - /app/node_modules
    # محیط توسعه: اجرای برنامه با watch
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "2001:2001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-edge:
    build: .
    environment:
      NODE_ROLE: EDGE
      NODE_ENV: development
      EDGE_NODE_ID: "03d3a6c3-4fec-4ab7-b56b-04cb756c828f"
      PORT: "2002"
      DATABASE_URL: postgresql://syncpage:syncpage@db:5432/syncpage?schema=public
      RABBITMQ_URL: amqp://syncpage:syncpage@rabbitmq:5672
      RABBITMQ_QUEUE: landing.sync.03d3a6c3-4fec-4ab7-b56b-04cb756c828f
      RABBITMQ_MASTER_QUEUE: form.submission
      ADMIN_TOKEN: change-me-admin-token
      STATIC_PAGES_PATH: /app/static_pages
      TEMP_PATH: /app/temp
      MASTER_INTERNAL_URL: http://app-master:2001
      PUBLIC_BASE_URL: http://localhost:2001
      SYNC_PULL_ENABLED: "1"
      SYNC_PULL_MS: "20000"
    volumes:
      - static_pages_edge:/app/static_pages
      - temp_data_edge:/app/temp
      # محیط توسعه: mount کردن کدها برای hot-reload
      - ./src:/app/src
      - ./views:/app/views
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./nest-cli.json:/app/nest-cli.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      # ایزوله کردن node_modules کانتینر
      - /app/node_modules
    # محیط توسعه: اجرای برنامه با watch
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app-master:
        condition: service_healthy
    ports:
      - "2002:2002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  rmqdata:
  static_pages:
  temp_data:
  static_pages_edge:
  temp_data_edge:

