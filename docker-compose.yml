# =============================================================================
# فقط برای توسعهٔ محلی (Master + Edge + Nginx روی پورت 80)
# روی سرور پروداکشن Master از این فایل استفاده نکنید:
#   docker compose -f docker-compose.master.yml --env-file .env up -d
# =============================================================================
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncpage
      POSTGRES_PASSWORD: syncpage
      POSTGRES_DB: syncpage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncpage -d syncpage"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: syncpage
      RABBITMQ_DEFAULT_PASS: syncpage
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    volumes:
      - ./rabbitmq/definitions.template.json:/etc/rabbitmq/definitions.template.json:ro
      - ./rabbitmq/docker-entrypoint.sh:/entrypoint-wrapper.sh:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rmqdata:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  app-master:
    build: .
    environment:
      NODE_ROLE: MASTER
      PORT: "2001"
      DATABASE_URL: postgresql://syncpage:syncpage@db:5432/syncpage?schema=public
      RABBITMQ_URL: amqp://syncpage:syncpage@rabbitmq:5672
      RABBITMQ_PUBLIC_URL: amqp://syncpage:syncpage@localhost:5672
      RABBITMQ_QUEUE: landing.sync
      RABBITMQ_MASTER_QUEUE: form.submission
      ADMIN_TOKEN: change-me-admin-token
      STATIC_PAGES_PATH: /app/static_pages
      TEMP_PATH: /app/temp
      MASTER_INTERNAL_URL: http://app-master:2001
      PUBLIC_BASE_URL: http://localhost
      OUTBOX_POLL_MS: "3000"
      SYNCPAGE_GITHUB_REPO: rm1dev/SyncPage
      SYNCPAGE_GITHUB_BRANCH: main
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "2001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-edge:
    build: .
    environment:
      NODE_ROLE: EDGE
      EDGE_NODE_ID: "03d3a6c3-4fec-4ab7-b56b-04cb756c828f"
      PORT: "2001"
      DATABASE_URL: postgresql://syncpage:syncpage@db:5432/syncpage?schema=public
      RABBITMQ_URL: amqp://syncpage:syncpage@rabbitmq:5672
      RABBITMQ_QUEUE: landing.sync.03d3a6c3
      RABBITMQ_MASTER_QUEUE: form.submission
      ADMIN_TOKEN: change-me-admin-token
      STATIC_PAGES_PATH: /app/static_pages
      TEMP_PATH: /app/temp
      MASTER_INTERNAL_URL: http://app-master:2001
      PUBLIC_BASE_URL: http://localhost
    volumes:
      - static_pages:/app/static_pages
      - temp_data:/app/temp
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app-master:
        condition: service_healthy
    expose:
      - "2001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_pages:/static_pages:ro
    ports:
      - "80:80"
    depends_on:
      app-master:
        condition: service_healthy
      app-edge:
        condition: service_healthy

volumes:
  pgdata:
  rmqdata:
  static_pages:
  temp_data:
